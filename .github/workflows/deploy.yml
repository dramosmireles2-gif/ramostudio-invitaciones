# Publica el sitio (ramostudio.com.mx: demo y bodas de clientes) en GitHub Pages
# en cada push a main. En Settings → Pages, "Source" debe ser "GitHub Actions" y
# el dominio personalizado ramostudio.com.mx (public/CNAME viaja en dist/, pero
# con Actions el dominio se toma de esa configuración).
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; si llega otro push, el que está en curso termina.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # npm test (Playwright: invitación en Android y iPhone, panel, web de marca y
  # seguridad entre familias). Si algo falla, no se publica.
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: test-results/
          retention-days: 7

  build:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
